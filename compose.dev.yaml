name: microbio-lab-dev
services:
  init-data:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /data/sources /data/builds /data/published /data/covers && chmod 0755 /data/sources /data/builds /data/published /data/covers"]
    volumes:
      - dev-sources:/data/sources
      - dev-builds:/data/builds
      - dev-published:/data/published
      - dev-covers:/data/covers
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: microbio
      POSTGRES_USER: microbio
      POSTGRES_PASSWORD: microbio
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["dev-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microbio -d microbio"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: { context: ., dockerfile: infra/docker/Dockerfile.app }
    environment:
      DATABASE_URL: postgresql://microbio:microbio@db:5432/microbio
      SESSION_SECRET: development-session-secret-at-least-32-chars
      SESSION_SECURE: "false"
      PLATFORM_ORIGIN: http://localhost:18080
      EXPERIMENT_ORIGIN: http://localhost:18081
      SOURCE_ROOT: /data/sources
      BUILD_ROOT: /data/builds
      PUBLISHED_ROOT: /data/published
      COVER_ROOT: /data/covers
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - dev-sources:/data/sources
      - dev-builds:/data/builds
      - dev-published:/data/published
      - dev-covers:/data/covers
    depends_on:
      db: { condition: service_healthy }
      init-data: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  builder:
    build: { context: ., dockerfile: infra/docker/Dockerfile.builder }
    environment:
      DATABASE_URL: postgresql://microbio:microbio@db:5432/microbio
      SOURCE_ROOT: /data/sources
      BUILD_ROOT: /data/builds
      BUILDER_VERSION: dev
    volumes:
      - dev-sources:/data/sources:ro
      - dev-builds:/data/builds
    depends_on: { app: { condition: service_healthy } }
  exp-web:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:18081:8080"]
    volumes:
      - dev-published:/usr/share/nginx/html/e:ro
      - ./infra/exp-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/exp-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  dev-postgres: {}
  dev-sources: {}
  dev-builds: {}
  dev-published: {}
  dev-covers: {}
