server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  disable_symlinks on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors *; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location /e/ {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ =404;
  }
  location / { return 404; }
}
