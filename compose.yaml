name: microbio-lab

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ghcr.io/${GHCR_OWNER}/microbio-lab-app:${PLATFORM_VERSION}
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    volumes:
      - ${DATA_ROOT}/sources:/data/sources
      - ${DATA_ROOT}/builds:/data/builds
      - ${DATA_ROOT}/published:/data/published
      - ${DATA_ROOT}/covers:/data/covers
      - ${DATA_ROOT}/logs:/data/logs
    networks: [frontend, backend]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  builder:
    image: ghcr.io/${GHCR_OWNER}/microbio-lab-builder:${PLATFORM_VERSION}
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ${DATA_ROOT}/sources:/data/sources:ro
      - ${DATA_ROOT}/builds:/data/builds
      - ${DATA_ROOT}/logs:/data/logs
    networks: [backend]
    depends_on:
      app: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5

  exp-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    user: "101:101"
    ports:
      - "127.0.0.1:${EXP_PORT}:8080"
    volumes:
      - ${DATA_ROOT}/published:/usr/share/nginx/html/e:ro
      - ./infra/exp-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/exp-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  frontend: {}
  backend:
    internal: true
